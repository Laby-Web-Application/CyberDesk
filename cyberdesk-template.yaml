AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CyberDesk - trojwarstwowa architektura AWS (ALB + ASG + RDS Multi-AZ).
  Aplikacja jest dostarczana jako obraz z ECR i wdrazana przez pipeline CI/CD (SSM Run Command).
  Wdrazany przez GitHub Actions (.github/workflows/deploy.yml) z rola wykonawcza CloudFormation.

Parameters:
  HostedZoneId:
    Type: String
    AllowedPattern: '^Z[A-Z0-9]+$'
    Description: ID strefy Route 53 dla cyberdesk.com.pl (Route 53 -> Hosted zones)
  DomainName:
    Type: String
    Default: app.cyberdesk.com.pl
    Description: Pelna nazwa subdomeny dla aplikacji
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
  InstanceType:
    Type: String
    Default: t3.micro
  EcrRepositoryName:
    Type: String
    Default: cyberdesk
    Description: Repozytorium ECR z obrazem aplikacji (tworzone przez infra/cyberdesk-cicd.yaml)
  ImageTagParameterName:
    Type: String
    Default: /cyberdesk/image-tag
    Description: Parametr SSM z aktualnie wdrozonym tagiem obrazu (ustawia go pipeline)
  DemoMode:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
    Description: >-
      1 = konta demonstracyjne z jawnymi haslami (na prezentacje).
      Na publicznej domenie to ryzyko - po prezentacji ustawcie 0.
  DBEngineVersion:
    Type: String
    Default: '15'
    Description: Wersja PostgreSQL (L3 - PostgreSQL 15); sama wersja glowna = domyslna wersja poboczna RDS
  DBMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Multi-AZ dla RDS (wymaganie L3); 'false' obniza koszt podczas testow

Resources:
  # --- SIEC VPC I BRAMY ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  IGW:
    Type: AWS::EC2::InternetGateway
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  # --- PODSIECI: TIER 1 (Public), TIER 2 (App), TIER 3 (DB) ---
  PubSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PubSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  DBSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  DBSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.22.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  # --- NAT GATEWAY I ROUTING ---
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PubSubnetA

  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW
  PubSubARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PubSubnetA
      RouteTableId: !Ref PublicRT
  PubSubBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PubSubnetB
      RouteTableId: !Ref PublicRT

  PrivateRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRT
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  AppSubARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref PrivateRT
  AppSubBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref PrivateRT

  # --- SECURITY GROUPS ---
  ALBSG:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_260
            comment: Port 80 otwarty wylacznie dla przekierowania 301 na HTTPS
    Properties:
      GroupDescription: HTTP (tylko przekierowanie) i HTTPS z internetu do ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: HTTPS
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP - tylko przekierowanie 301 na HTTPS
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  AppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ruch HTTP 5000 z ALB do EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: Aplikacja tylko z ALB
          IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSG

  DBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ruch PostgreSQL 5432 z EC2 do RDS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: PostgreSQL tylko z warstwy aplikacji
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSG

  # --- TIER 1: APPLICATION LOAD BALANCER ---
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_91
            comment: Access logi ALB pominiete swiadomie - koszt S3 w projekcie studenckim
    Properties:
      Subnets: [!Ref PubSubnetA, !Ref PubSubnetB]
      SecurityGroups: [!Ref ALBSG]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 5000
      Protocol: HTTP
      HealthCheckPath: /health
      HealthCheckPort: '5000'
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref SSLCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HTTPRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  # --- SEKRETY (Secrets Manager) - zadnych hasel w kodzie ani w parametrach ---
  DbAdminSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Szyfrowanie kluczem zarzadzanym przez AWS (aws/secretsmanager) zamiast wlasnego KMS - koszt
    Properties:
      Description: CyberDesk - wlasciciel schematu / master RDS
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cyberdesk"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbAppSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Szyfrowanie kluczem zarzadzanym przez AWS (aws/secretsmanager) zamiast wlasnego KMS - koszt
    Properties:
      Description: CyberDesk - ograniczony uzytkownik runtime (cyberdesk_app)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cyberdesk_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  FlaskSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Szyfrowanie kluczem zarzadzanym przez AWS (aws/secretsmanager) zamiast wlasnego KMS - koszt
    Properties:
      Description: CyberDesk - SECRET_KEY Flaska (wspolny dla wszystkich instancji za ALB)
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: secret_key
        PasswordLength: 64
        ExcludePunctuation: true

  # --- IAM DLA INSTANCJI EC2 (least privilege) ---
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Agent SSM: zdalne wdrozenia (Run Command) bez SSH i bez otwierania portu 22
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cyberdesk-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPullOnlyAppRepo
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
              - Sid: ReadOnlyOwnSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DbAdminSecret, !Ref DbAppSecret, !Ref FlaskSecret]
              - Sid: ReadImageTag
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ImageTagParameterName}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # --- TIER 2: AUTO SCALING GROUP (EC2 + Docker) ---
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds: [!Ref AppSG]
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required          # IMDSv2 - ochrona przed SSRF -> kradzieza poswiadczen
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1    # kontenery nie siegaja do metadanych instancji
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 16
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y docker
            systemctl enable --now docker
            install -d -m 700 /etc/cyberdesk

            # Konfiguracja bez sekretow; sekrety sa pobierane z Secrets Manager przy kazdym wdrozeniu
            cat > /etc/cyberdesk/config <<'CONF'
            REGION=${AWS::Region}
            ACCOUNT=${AWS::AccountId}
            REPO=${EcrRepositoryName}
            TAG_PARAM=${ImageTagParameterName}
            DB_HOST=${RDSDatabase.Endpoint.Address}
            DB_ADMIN_SECRET=${DbAdminSecret}
            DB_APP_SECRET=${DbAppSecret}
            FLASK_SECRET=${FlaskSecret}
            DEMO_MODE=${DemoMode}
            CONF
            chmod 600 /etc/cyberdesk/config

            # Skrypt wdrozeniowy: wywoluje go pipeline przez SSM Run Command, oraz kazda nowa instancja przy starcie
            cat > /usr/local/bin/cyberdesk-deploy.sh <<'DEPLOY'
            #!/bin/bash
            # Uzycie: cyberdesk-deploy.sh [tag]   (bez tagu: aktualny tag z SSM Parameter Store)
            set -euo pipefail
            # shellcheck source=/dev/null
            . /etc/cyberdesk/config
            TAG="${!1:-}"
            if [ -z "$TAG" ]; then
              TAG=$(aws ssm get-parameter --region "$REGION" --name "$TAG_PARAM" --query Parameter.Value --output text 2>/dev/null || true)
            fi
            if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then echo "Brak opublikowanego obrazu - pomijam"; exit 0; fi
            case "$TAG" in *[!A-Za-z0-9._-]*) echo "Nieprawidlowy tag: $TAG"; exit 1;; esac
            for _ in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
            REGISTRY="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
            IMAGE="$REGISTRY/$REPO:$TAG"
            if [ "$(docker inspect -f '{{.Config.Image}}' cyberdesk 2>/dev/null || true)" = "$IMAGE" ] \
               && curl -fsS http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "Wersja $TAG juz dziala - bez zmian"; exit 0
            fi
            aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$IMAGE"
            secret() { aws secretsmanager get-secret-value --region "$REGION" --secret-id "$1" --query SecretString --output text | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]])" "$2"; }
            umask 077
            {
              echo "DB_HOST=$DB_HOST"
              echo "DB_NAME=vulntrack"
              echo "ADMIN_DB_PASS=$(secret "$DB_ADMIN_SECRET" password)"
              echo "APP_DB_PASS=$(secret "$DB_APP_SECRET" password)"
              echo "SECRET_KEY=$(secret "$FLASK_SECRET" secret_key)"
              echo "DEMO_MODE=$DEMO_MODE"
              echo "COOKIE_SECURE=1"
              echo "TRUST_PROXY=1"
            } > /etc/cyberdesk/app.env
            docker rm -f cyberdesk >/dev/null 2>&1 || true
            docker run -d --name cyberdesk --restart unless-stopped -p 5000:5000 \
              --env-file /etc/cyberdesk/app.env \
              --read-only --tmpfs /tmp:size=16M,noexec,nosuid,nodev \
              --cap-drop ALL --security-opt no-new-privileges:true \
              "$IMAGE"
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:5000/health >/dev/null 2>&1; then
                echo "Wdrozono $TAG"
                docker image prune -af --filter "until=24h" >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 3
            done
            echo "Health check nie przeszedl po wdrozeniu $TAG"; docker logs --tail 80 cyberdesk; exit 1
            DEPLOY
            chmod 750 /usr/local/bin/cyberdesk-deploy.sh

            # Nowa instancja (np. dodana przez autoskalowanie) od razu uruchamia aktualna wersje
            /usr/local/bin/cyberdesk-deploy.sh || echo "Pierwsze wdrozenie nieudane - zrobi to pipeline"

  ASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT3M
    Properties:
      VPCZoneIdentifier: [!Ref AppSubnetA, !Ref AppSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '3'
      DesiredCapacity: '2'
      TargetGroupARNs: [!Ref TargetGroup]
      Tags:
        - Key: Project
          Value: CyberDesk           # po tym tagu pipeline (rola GitHub) moze wysylac komendy SSM
          PropagateAtLaunch: true
        - Key: Name
          Value: cyberdesk-app
          PropagateAtLaunch: true

  # Autoskalowanie (wymaganie L3 "*ze skalowaniem"): utrzymuj srednie CPU ok. 60%
  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref ASG
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60

  # --- TIER 3: AMAZON RDS POSTGRESQL 15 (MULTI-AZ) ---
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Prywatne podsieci dla RDS
      SubnetIds: [!Ref DBSubnetA, !Ref DBSubnetB]

  RDSDatabase:
    Type: AWS::RDS::DBInstance
    # Projekt studencki: usuniecie stacku usuwa baze bez snapshotu (szybkie sprzatanie, brak kosztow)
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            # Dane cfn-lint oznaczaja alias '15' jako wycofany, ale RDS w eu-north-1 przyjal go
            # (2026-11-22: RDSDatabase -> "Resource creation Initiated"). Wersja jest parametrem.
            - W3691
      checkov:
        skip:
          - id: CKV_AWS_161
            comment: Uwierzytelnianie IAM do RDS wymagaloby zmian w aplikacji; haslo z Secrets Manager
          - id: CKV_AWS_118
            comment: Enhanced Monitoring pominiety swiadomie - koszt
          - id: CKV_AWS_157
            comment: Multi-AZ jest domyslnie wlaczone; parametr pozwala wylaczyc na czas testow
    Properties:
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MaxAllocatedStorage: 50
      StorageEncrypted: true
      MultiAZ: !Ref DBMultiAZ
      DBName: vulntrack
      MasterUsername: cyberdesk
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbAdminSecret}::password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSG]
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      BackupRetentionPeriod: 1
      DeletionProtection: false

  # --- CERTYFIKAT ACM (AUTOMATYCZNA WALIDACJA PRZEZ ROUTE 53) ---
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # --- PRZEKIEROWANIE W ROUTE 53 NA LOAD BALANCER ---
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ALB.DNSName
        HostedZoneId: !GetAtt ALB.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  AppURL:
    Description: Adres aplikacji
    Value: !Sub https://${DomainName}
  ALBDNSName:
    Description: Adres DNS Load Balancera
    Value: !GetAtt ALB.DNSName
  AutoScalingGroupName:
    Value: !Ref ASG
